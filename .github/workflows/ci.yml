name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Run unit tests
        run: >
          npx tsx --test
          src/utils/urlParser.test.ts
          src/utils/piiGuard.test.ts
          src/utils/schemaBuilder.test.ts
          src/utils/dataTransforms.test.ts
          src/utils/sessionStore.test.ts
          src/utils/sheetsMapping.test.ts
          server/htmlExtractor.test.ts

      - name: Build production bundle
        run: npm run build
